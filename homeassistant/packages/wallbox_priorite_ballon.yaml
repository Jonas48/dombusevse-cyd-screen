# =============================================================================
#  packages/wallbox_priorite_ballon.yaml : la voiture passe avant le ballon
#  AJOUTÉ le 05/10.
#
#  Le routeur MSunPV chauffe le ballon jusqu'à son thermostat (≈ 70 °C) et
#  absorbe tout le surplus : la wallbox en Solaire ne voit presque rien et ne
#  démarre jamais. Ce package redonne vie au « Seuil ballon recharge voiture »
#  (input_number.seuil_temperature_ce) :
#
#  DÉMARRAGE : ballon au-dessus du seuil + wallbox en Solaire, voiture
#  branchée sans charger + production ≥ 1 800 W depuis 5 min -> charge à 6 A.
#  Le MSunPV se règle sur la puissance réseau : quand la voiture consomme, il
#  réduit de lui-même la chauffe du ballon. La voiture passe donc en priorité.
#
#  ARRÊT : dès que la maison IMPORTE plus de 300 W depuis 5 min (le ballon ne
#  peut plus céder sa place, la voiture tirerait sur le réseau), ou que la
#  batterie est pleine -> retour en Solaire, puis pause de 30 min avant de
#  réessayer (évite les marche/arrêt à répétition).
#
#  RÉGULATION (AJOUTÉE le 09/10) : pendant la priorité, HA ajuste le courant
#  de la voiture une fois par minute, en douceur : +1 A tant que le ballon
#  reçoit encore plus de 400 W (du surplus est disponible) ; si la maison
#  achète au réseau, baisse d'un coup selon l'achat et dans les 15 s (jamais sous
#  6 A). Le routeur, lui, réagit en quelques secondes et donne le reste au
#  ballon. Après une baisse, pause de 5 min avant de remonter (four, plaques
#  qui chauffent par cycles). Comme la voiture bouge lentement et
#  le routeur vite, les deux ne se battent plus (fini le yoyo constaté le
#  09/10 entre la wallbox en Solaire et le routeur en Zéro équilibre).
#
#  Ne fait rien si la wallbox est dans un autre mode (forçage, HC, STOP...).
# =============================================================================

input_boolean:
  wallbox_priorite_ballon_active:
    name: "Wallbox : charge prioritaire sur le ballon en cours"
    icon: mdi:water-boiler-off

# Dernier courant demandé par la régulation : sert à distinguer nos propres
# changements de courant d'une reprise en main manuelle.
input_number:
  wallbox_priorite_courant:
    name: "Wallbox : courant de la priorité ballon"
    icon: mdi:current-ac
    min: 6
    max: 12
    step: 1
    unit_of_measurement: A

timer:
  wallbox_priorite_ballon_pause:
    name: "Wallbox : pause priorité ballon"
    icon: mdi:timer-pause-outline
    duration: "00:30:00"
  # AJOUTÉ le 09/10 : après une baisse due à un achat, on attend 5 min avant
  # de remonter (le four ou les plaques chauffent par cycles : sans cette
  # pause, la voiture suivrait chaque cycle).
  wallbox_priorite_retenue:
    name: "Wallbox : pause avant remontée du courant"
    icon: mdi:timer-sand
    duration: "00:05:00"

automation:
  - id: wallbox_priorite_ballon_demarrage
    alias: "Wallbox – priorité voiture quand le ballon est chaud (démarrage)"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.solar_power
        above: 1800
        for: {minutes: 5}
      - trigger: template
        value_template: >-
          {{ states('sensor.water_heater_temperature') | float(0) >= states('input_number.seuil_temperature_ce') | float(100) }}
      # MODIFIÉ le 12/10 : aussi quand la voiture se met à charger tout de
      # suite en arrivant (12/10 : branchée à 12h33 directement « En charge »,
      # ballon déjà chaud et soleil déjà là -> aucun déclencheur, priorité
      # jamais lancée, voiture bloquée au minimum).
      - trigger: state
        entity_id: input_select.evstatename
        to: ["Connecté", "En charge", "En charge + ventilation"]
        for: {minutes: 2}
      - trigger: state
        entity_id: timer.wallbox_priorite_ballon_pause
        to: "idle"
    conditions:
      # Déjà en cours : on ne la relance pas (sinon retour à 6 A à chaque
      # passage « En charge » <-> « En charge + ventilation »)
      - condition: state
        entity_id: input_boolean.wallbox_priorite_ballon_active
        state: "off"
      - condition: template
        value_template: >-
          {{ states('sensor.water_heater_temperature') | float(0) >= states('input_number.seuil_temperature_ce') | float(100) }}
      - condition: numeric_state
        entity_id: sensor.solar_power
        above: 1800
      - condition: state
        entity_id: input_select.evmodename
        state: "Solaire"
      # MODIFIÉ le 09/10 : aussi quand la voiture charge déjà en Solaire
      # (c'est justement là que le yoyo avec le routeur se produisait)
      - condition: state
        entity_id: input_select.evstatename
        state: ["Connecté", "En charge", "En charge + ventilation"]
      - condition: numeric_state
        entity_id: sensor.car_battery_level
        below: 100
      - condition: state
        entity_id: timer.wallbox_priorite_ballon_pause
        state: "idle"
      - condition: state
        entity_id: input_boolean.wallbox_bloquer_retour_solaire
        state: "off"
      - condition: state
        entity_id: input_boolean.demande_recharge_hc
        state: "off"
    actions:
      - action: input_number.set_value
        target: {entity_id: input_number.wallbox_priorite_courant}
        data: {value: 6}
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.wallbox_priorite_ballon_active}
      - action: script.wallbox_charge_amperes
        data: {courant: 6}

  # AJOUTÉ le 09/10 : régulation lente du courant pendant la priorité
  - id: wallbox_priorite_ballon_regulation
    alias: "Wallbox – priorité ballon : régulation du courant"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      # AJOUTÉ le 09/10 : réaction immédiate à un gros appel (four, bouilloire)
      - trigger: numeric_state
        entity_id: sensor.grid_power
        above: 300
        for: {seconds: 15}
    conditions:
      - condition: state
        entity_id: input_boolean.wallbox_priorite_ballon_active
        state: "on"
      - condition: state
        entity_id: input_select.evmodename
        state: "100%"
      - condition: state
        entity_id: input_select.evstatename
        state: ["En charge", "En charge + ventilation"]
    actions:
      - variables:
          actuel: "{{ states('input_number.evmaxcurrent') | int(6) }}"
          ballon: "{{ states('sensor.water_heater_power') | float(0) }}"
          reseau: "{{ states('sensor.grid_power') | float(0) }}"
          # MODIFIÉ le 09/10 : à la baisse, on lâche d'un coup les ampères
          # correspondant à l'achat (230 W par ampère) ; la hausse reste
          # douce (+1 A par minute).
          cible: >-
            {% if reseau > 100 and actuel > 6 %}{{ [6, actuel - ((reseau / 230) | round(0, 'ceil') | int)] | max }}
            {% elif ballon > 400 and reseau < 50 and actuel < 12
                    and is_state('timer.wallbox_priorite_retenue', 'idle') %}{{ actuel + 1 }}
            {% else %}{{ actuel }}{% endif %}
      - condition: template
        value_template: "{{ cible | int != actuel | int }}"
      - action: input_number.set_value
        target: {entity_id: input_number.wallbox_priorite_courant}
        data: {value: "{{ cible | int }}"}
      - action: input_number.set_value
        target: {entity_id: input_number.evmaxcurrent}
        data: {value: "{{ cible | int }}"}
      # Baisse : pause de 5 min avant toute remontée (relancée à chaque baisse)
      - if:
          - condition: template
            value_template: "{{ cible | int < actuel | int }}"
        then:
          - action: timer.start
            target: {entity_id: timer.wallbox_priorite_retenue}

  - id: wallbox_priorite_ballon_arret
    alias: "Wallbox – priorité voiture quand le ballon est chaud (arrêt)"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.grid_power
        above: 300
        for: {minutes: 5}
      - trigger: numeric_state
        entity_id: sensor.car_battery_level
        above: 99
      # AJOUTÉ le 09/10 : le ballon a refroidi (eau chaude tirée) de 3 °C sous
      # le seuil : on lui rend le surplus. Vu le 09/10 : priorité lancée à
      # 57 °C, ballon retombé à 52 °C, la voiture restait forcée à 6 A.
      - trigger: template
        value_template: >-
          {{ states('sensor.water_heater_temperature') | float(100) < states('input_number.seuil_temperature_ce') | float(0) - 3 }}
        for: {minutes: 2}
    conditions:
      - condition: state
        entity_id: input_boolean.wallbox_priorite_ballon_active
        state: "on"
      - condition: state
        entity_id: input_select.evmodename
        state: "100%"
    actions:
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.wallbox_priorite_ballon_active}
      - action: script.wallbox_mode_solaire
      - action: timer.start
        target: {entity_id: timer.wallbox_priorite_ballon_pause}

  # Si quelqu'un reprend la main (STOP, FORCER, HC, débranchement...), la
  # charge n'est plus « la nôtre » : on oublie le marqueur sans rien toucher.
  - id: wallbox_priorite_ballon_oubli
    alias: "Wallbox – priorité ballon : reprise en main manuelle"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_select.evmodename
        from: "100%"
      - trigger: state
        entity_id: input_number.evmaxcurrent
      - trigger: state
        entity_id: input_boolean.demande_recharge_hc
        to: "on"
      - trigger: state
        entity_id: binary_sensor.car_plugged_in
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.wallbox_priorite_ballon_active
        state: "on"
      # MODIFIÉ le 09/10 : ignore les changements faits par la régulation
      - condition: template
        value_template: >-
          {{ not (trigger.entity_id == 'input_number.evmaxcurrent'
                  and states('input_number.evmaxcurrent') | int(0)
                      == states('input_number.wallbox_priorite_courant') | int(-1)) }}
    actions:
      - action: input_boolean.turn_off
        target: {entity_id: input_boolean.wallbox_priorite_ballon_active}
